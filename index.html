<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntro Academy - Reserva de Citas</title>
    <style>
        /* Estilos de Diseño Neumórfico Premium */
        :root {
            --bg: #e2e8f0;            
            --shadow-dark: #cbd5e1;   
            --shadow-light: #ffffff;  
            --accent-main: #184e77;   
            --accent-select: #1e6091; 
            --teal-active: #34a0a4;   
            --text-dark: #1e293b;     
            --text-muted: #64748b;    
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
        }

        .brand-logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            background: #111827; 
            padding: 10px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border: 3px solid var(--bg);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; color: var(--accent-main); margin-bottom: 6px; font-weight: 700; }
        .header p { font-size: 0.85rem; color: var(--text-muted); }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: var(--bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: var(--teal-active);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .month-display {
            font-weight: 700;
            color: var(--accent-main);
            text-transform: uppercase;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .day-name { font-size: 0.75rem; font-weight: 700; color: var(--accent-main); margin-bottom: 4px; }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            color: var(--text-dark);
        }

        .day.selected { 
            background: var(--accent-select); 
            color: #ffffff; 
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3); 
        }
        
        .day.empty { box-shadow: none; cursor: default; background: transparent; }

        .hours-section, .form-section { 
            display: none; 
            margin-top: 25px; 
            border-top: 2px dashed var(--shadow-dark); 
            padding-top: 20px; 
        }
        
        .hours-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .btn-hour {
            padding: 12px 5px;
            border-radius: 12px;
            border: none;
            background: var(--bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            text-align: center;
        }

        .btn-hour.selected { 
            background: var(--accent-select); 
            color: #ffffff; 
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3); 
        }

        .btn-hour.occupied {
            background: #cbd5e1 !important;
            color: #94a3b8 !important;
            cursor: not-allowed !important;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1) !important;
            text-decoration: line-through;
            opacity: 0.6;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: var(--bg);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-main);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 4px 4px 12px var(--shadow-dark);
            cursor: pointer;
            font-size: 1rem;
        }

        .loading-text {
            text-align: center;
            grid-column: span 3;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        .error-msg {
            color: #dc2626;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-logo-wrapper">
        <img src="logo.png" alt="Syntro Academy" class="brand-logo">
    </div>

    <div class="header">
        <h1>Agenda tu Consultoría</h1>
        <p>Visualiza los espacios y aparta tu horario libre</p>
    </div>

    <div class="calendar-nav">
        <button type="button" class="nav-btn" onclick="changeMonth(-1)"> &lt; </button>
        <div id="monthDisplay" class="month-display"></div>
        <button type="button" class="nav-btn" onclick="changeMonth(1)"> &gt; </button>
    </div>

    <div class="grid" id="calendarGrid"></div>

    <div id="hoursSection" class="hours-section">
        <h4 id="hoursTitle" style="text-align:center; margin-bottom:15px; font-size: 0.9rem; color: var(--accent-main);">Horarios Disponibles</h4>
        <div class="hours-grid" id="hoursGrid"></div>
        <div id="connectionError" class="error-msg" style="display: none;"></div>
    </div>

    <form id="appointmentForm" class="form-section">
        <input type="text" id="clientName" placeholder="Nombre Completo" required>
        <textarea id="reason" placeholder="Escribe el motivo de tu consulta..." rows="3" required></textarea>
        <button type="submit" id="submitBtn" class="submit-btn">CONFIRMAR Y AGENDAR CITA</button>
    </form>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbz1m-BLE8w0oQBJcFivRCECPPa3Ajl5HZpHW_h43yLioV-Bcx10nQZ7K4sWeTcn_apY/exec"; 

    let currentDate = new Date();
    let selectedDateString = null; 
    let selectedHour = null;
    let baseCitasOcupadas = [];

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        monthDisplay.innerText = `${monthNames[month]} ${year}`;

        ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
            grid.innerHTML += `<div class="day-name">${d}</div>`;
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        for (let i = 0; i < offset; i++) {
            grid.innerHTML += `<div class="day empty"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
            grid.innerHTML += `<button type="button" class="day" onclick="selectDay(this, ${d})">${d}</button>`;
        }
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
        document.getElementById('hoursSection').style.display = 'none';
        document.getElementById('appointmentForm').style.display = 'none';
    }

    function selectDay(element, day) {
        document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
        element.classList.add('selected');
        
        selectedDateString = `${day}/${currentDate.getMonth() + 1}/${currentDate.getFullYear()}`;
        
        document.getElementById('hoursTitle').innerText = `Horarios para el día ${day} de ${document.getElementById('monthDisplay').innerText.split(' ')[0]}`;
        const hoursGrid = document.getElementById('hoursGrid');
        const errorDiv = document.getElementById('connectionError');
        
        document.getElementById('hoursSection').style.display = 'block';
        document.getElementById('appointmentForm').style.display = 'none';
        errorDiv.style.display = 'none';
        
        hoursGrid.innerHTML = `<div class="loading-text">Verificando disponibilidad en tiempo real...</div>`;
        
        fetch(URL_SCRIPT)
        .then(res => res.json())
        .then(data => {
            baseCitasOcupadas = Array.isArray(data) ? data : [];
            construirHorarios(hoursGrid);
        })
        .catch(() => {
            hoursGrid.innerHTML = '';
            errorDiv.innerText = "Error de conexión con el servidor. Por razones de seguridad, no puede agendar en este momento. Seleccione el día nuevamente para reintentar.";
            errorDiv.style.display = 'block';
            baseCitasOcupadas = [];
        });
    }

    function verificarOcupado(fechaStr, horaStr) {
        return baseCitasOcupadas.some(cita => {
            if(!cita.fecha || !cita.hora) return false;
            const partes = cita.fecha.split('/');
            if(partes.length !== 3) return false;
            const fechaNormalizada = `${parseInt(partes[0],10)}/${parseInt(partes[1],10)}/${partes[2]}`;
            return fechaNormalizada === fechaStr && cita.hora.toUpperCase() === horaStr.toUpperCase();
        });
    }

    function construirHorarios(contenedor) {
        contenedor.innerHTML = '';
        
        for(let h = 8; h <= 18; h++) {
            let timeStr = h > 12 ? `${h-12}:00 PM` : `${h}:00 AM`;
            if(h === 12) timeStr = "12:00 PM";
            
            const estaOcupado = verificarOcupado(selectedDateString, timeStr);
            
            if(estaOcupado) {
                contenedor.innerHTML += `<button type="button" class="btn-hour occupied" disabled>${timeStr}</button>`;
            } else {
                contenedor.innerHTML += `<button type="button" class="btn-hour" onclick="selectHour(this, '${timeStr}')">${timeStr}</button>`;
            }
        }
    }

    function selectHour(element, hour) {
        document.querySelectorAll('.btn-hour').forEach(h => h.classList.remove('selected'));
        element.classList.add('selected');
        selectedHour = hour;
        document.getElementById('appointmentForm').style.display = 'block';
    }

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (verificarOcupado(selectedDateString, selectedHour)) {
            alert(`⚠️ HORARIO NO DISPONIBLE:\nLo sentimos, el horario de las ${selectedHour} para el día ${selectedDateString} ya se encuentra ocupado.\n\nEl sistema cancelará este envío por seguridad.`);
            document.getElementById('appointmentForm').style.display = 'none';
            const diaSeleccionado = selectedDateString.split('/')[0];
            selectDay(document.querySelector('.day.selected'), diaSeleccionado);
            return; 
        }
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "PROCESANDO RESERVA...";
        btn.disabled = true;

        const data = {
            fecha: selectedDateString,
            hora: selectedHour,
            nombre: document.getElementById('clientName').value,
            motivo: document.getElementById('reason').value
        };

        fetch(URL_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert(`¡Excelente!\nTu consultoría ha sido agendada con éxito.\n\nFecha: ${data.fecha}\nHora: ${data.hora}`);
            document.getElementById('appointmentForm').reset();
            document.getElementById('hoursSection').style.display = 'none';
            document.getElementById('appointmentForm').style.display = 'none';
            document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
            btn.innerText = "CONFIRMAR Y AGENDAR CITA";
            btn.disabled = false;
            renderCalendar();
        });
    });

    renderCalendar();
</script>
</body>
</html>
