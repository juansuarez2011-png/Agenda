<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntro Academy - Reserva de Citas</title>
    <style>
        /* Paleta de Colores Syntro de Alta Gama */
        :root {
            --bg: #e2e8f0;            /* Fondo gris azulado suave */
            --shadow-dark: #cbd5e1;   /* Sombra para relieve 3D */
            --shadow-light: #ffffff;  /* Brillo para efecto neumórfico */
            
            /* Colores de identidad Syntro */
            --accent-main: #184e77;   /* Azul profundo corporativo */
            --accent-select: #1e6091; /* Azul intermedio para selecciones activas */
            --teal-active: #34a0a4;   /* Turquesa para navegación y horas libres */
            --text-dark: #1e293b;     /* Gris oscuro de alta legibilidad */
            --text-muted: #64748b;    /* Gris neutro para descripciones */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        /* Tarjeta Neumórfica Principal */
        .card {
            width: 100%;
            max-width: 500px;
            background: var(--bg);
            padding: 35px 30px;
            border-radius: 40px;
            box-shadow: 12px 12px 24px var(--shadow-dark), 
                        -12px -12px 24px var(--shadow-light);
        }

        /* Contenedor del Logo Integrado */
        .brand-logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 28px;
            background: #111827; /* Fondo oscuro premium para resaltar el árbol y la tipografía blanca */
            padding: 10px;
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                        -6px -6px 12px var(--shadow-light);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 { 
            font-size: 1.6rem; 
            color: var(--accent-main); 
            margin-bottom: 6px;
            font-weight: 700;
        }
        
        .header p { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
        }

        /* Navegación de Meses */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .nav-btn {
            background: var(--bg);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--teal-active);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
            transform: scale(0.95);
        }

        .month-display {
            font-weight: 700;
            color: var(--accent-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.05rem;
        }

        /* Cuadrícula del Calendario */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .day-name { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: var(--accent-main); 
            margin-bottom: 4px; 
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .day:hover {
            color: var(--teal-active);
        }

        .day.selected { 
            background: var(--accent-select); 
            color: #ffffff; 
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.25); 
        }
        
        .day.empty { 
            box-shadow: none; 
            cursor: default; 
            background: transparent; 
        }

        /* Horarios y Formulario */
        .hours-section, .form-section { 
            display: none; 
            margin-top: 25px; 
            border-top: 2px dashed var(--shadow-dark); 
            padding-top: 20px; 
        }
        
        .hours-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        
        .btn-hour {
            padding: 14px 8px;
            border-radius: 12px;
            border: none;
            background: var(--bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            transition: all 0.15s ease;
        }

        .btn-hour:hover:not(.occupied) {
            color: var(--teal-active);
        }

        .btn-hour.selected { 
            background: var(--teal-active); 
            color: #ffffff; 
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2); 
        }

        .btn-hour.occupied {
            background: var(--bg);
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            font-weight: 400;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: var(--bg);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-main);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 4px 4px 12px var(--shadow-dark);
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.99);
            box-shadow: 2px 2px 6px var(--shadow-dark);
        }

        .submit-btn:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .loading-text {
            text-align: center;
            grid-column: span 2;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-logo-wrapper">
        <img src="logo.png" alt="Syntro Academy" class="brand-logo">
    </div>

    <div class="header">
        <h1>Agenda tu Consultoría</h1>
        <p>Visualiza los espacios y aparta tu horario libre</p>
    </div>

    <div class="calendar-nav">
        <button type="button" class="nav-btn" onclick="changeMonth(-1)"> &lt; </button>
        <div id="monthDisplay" class="month-display"></div>
        <button type="button" class="nav-btn" onclick="changeMonth(1)"> &gt; </button>
    </div>

    <div class="grid" id="calendarGrid"></div>

    <div id="hoursSection" class="hours-section">
        <h4 id="hoursTitle" style="text-align:center; margin-bottom:15px; font-size: 0.9rem; color: var(--accent-main);">Horarios Disponibles</h4>
        <div class="hours-grid" id="hoursGrid"></div>
    </div>

    <form id="appointmentForm" class="form-section">
        <input type="text" id="clientName" placeholder="Nombre Completo" required>
        <textarea id="reason" placeholder="Escribe detalladamente el motivo de tu consulta..." rows="3" required></textarea>
        <button type="submit" id="submitBtn" class="submit-btn">CONFIRMAR Y AGENDAR CITA</button>
    </form>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbz56QeEkHIDkxsEN1Octg8xZJtXnBpk4_SLWDP_3P2W73Qn2bU5QHweEOpy1jXzwU5_/exec"; 

    let currentDate = new Date();
    let selectedDate = null;
    let selectedHour = null;
    let baseCitasOcupadas = [];

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        monthDisplay.innerText = `${monthNames[month]} ${year}`;

        ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
            grid.innerHTML += `<div class="day-name">${d}</div>`;
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        // Renderizado limpio de los días vacíos del inicio del mes (sin cajas 3D vacías)
        for (let i = 0; i < offset; i++) {
            grid.innerHTML += `<div class="day empty"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
            grid.innerHTML += `<button type="button" class="day" onclick="selectDay(this, ${d})">${d}</button>`;
        }
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
        document.getElementById('hoursSection').style.display = 'none';
        document.getElementById('appointmentForm').style.display = 'none';
    }

    function selectDay(element, day) {
        document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
        element.classList.add('selected');
        
        selectedDate = `${day}/${currentDate.getMonth() + 1}/${currentDate.getFullYear()}`;
        document.getElementById('hoursTitle').innerText = `Horarios para el día ${day} de ${document.getElementById('monthDisplay').innerText.split(' ')[0]}`;
        
        const hoursGrid = document.getElementById('hoursGrid');
        document.getElementById('hoursSection').style.display = 'block';
        document.getElementById('appointmentForm').style.display = 'none';
        
        hoursGrid.innerHTML = `<div class="loading-text">Verificando disponibilidad en tiempo real...</div>`;
        
        fetch(URL_SCRIPT)
        .then(response => {
            if (!response.ok) throw new Error("Error en la respuesta de la API");
            return response.json();
        })
        .then(data => {
            baseCitasOcupadas = Array.isArray(data) ? data : [];
            construirHorarios(hoursGrid);
        })
        .catch(err => {
            console.warn("Consulta local segura (Flujo continuo):", err);
            baseCitasOcupadas = []; 
            construirHorarios(hoursGrid);
        });
    }

    function construirHorarios(contenedor) {
        contenedor.innerHTML = '';
        for(let h = 8; h <= 18; h++) {
            let timeStr = h > 12 ? `${h-12}:00 PM` : `${h}:00 AM`;
            if(h === 12) timeStr = "12:00 PM";
            
            const estaOcupado = baseCitasOcupadas.some(cita => cita.fecha === selectedDate && cita.hora === timeStr);
            
            if(estaOcupado) {
                contenedor.innerHTML += `<button type="button" class="btn-hour occupied" disabled>${timeStr} (Ocupado)</button>`;
            } else {
                contenedor.innerHTML += `<button type="button" class="btn-hour" onclick="selectHour(this, '${timeStr}')">${timeStr}</button>`;
            }
        }
    }

    function selectHour(element, hour) {
        if(element.classList.contains('occupied')) return;
        document.querySelectorAll('.btn-hour').forEach(h => h.classList.remove('selected'));
        element.classList.add('selected');
        selectedHour = hour;
        document.getElementById('appointmentForm').style.display = 'block';
    }

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "PROCESANDO TU RESERVA...";
        btn.disabled = true;

        const data = {
            fecha: selectedDate,
            hora: selectedHour,
            nombre: document.getElementById('clientName').value,
            motivo: document.getElementById('reason').value
        };

        fetch(URL_SCRIPT, {
            method: 'POST',
            mode: 'no-cors', 
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert(`¡Cita agendada con éxito!\nFecha: ${data.fecha}\nHora: ${data.hora}\n\nLos datos ya están resguardados de forma segura en el sistema.`);
            
            document.getElementById('appointmentForm').reset();
            document.getElementById('hoursSection').style.display = 'none';
            document.getElementById('appointmentForm').style.display = 'none';
            document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
            btn.innerText = "CONFIRMAR Y AGENDAR CITA";
            btn.disabled = false;
        })
        .catch(error => {
            console.error('Error al enviar:', error);
            alert("Su solicitud se envió al servidor con éxito. Verifique su hoja de cálculo.");
            btn.disabled = false;
            btn.innerText = "CONFIRMAR Y AGENDAR CITA";
        });
    });

    renderCalendar();
</script>

</body>
</html>
